# Render blueprint for the live demo (https://render.com/docs/blueprint-spec).
# Plan 0.5c-512mb (paid, the former Starter): fixed monthly price and no sleeping, so judges never
# wait for a cold start. Measured: building the database peaks at about 300 MB; the server uses about 15 MB.
# The database is built from the source dumps at deploy time and never stored in the repository.
# Secrets (the model API key) are entered in Render's dashboard, never committed here.
services:
  - type: web
    name: muhawir
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt && python -m muhawir.build_data --download
    startCommand: uvicorn muhawir.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: LLM_PROVIDER
        value: model
      - key: ANTHROPIC_API_KEY
        sync: false          # Render asks for the value when the blueprint is created
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: MUHAWIR_DORAR
        value: "0"
