<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مُحاور</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1f2430; --muted: #5d6475;
    --line: #dedbd2; --accent: #1f6f5c; --accent-ink: #ffffff;
    --warn-bg: #fff4dc; --warn-ink: #6b4a00; --card: #f2f7f5; --mine: #e6f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181d; --panel: #1d2128; --ink: #e9ebef; --muted: #a3a9b6;
      --line: #313743; --accent: #4fb69a; --accent-ink: #0d1512;
      --warn-bg: #3a3017; --warn-ink: #f2d999; --card: #1b2a26; --mine: #20302b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.7 "Segoe UI", Tahoma, "Noto Naskh Arabic", "Noto Sans Arabic", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 24px; min-height: 100vh;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 30px; }
  .tag { color: var(--muted); margin: 4px 0 16px; }
  .banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px;
            padding: 10px 14px; margin-bottom: 16px; font-size: 15px; }
  label { color: var(--muted); font-size: 15px; }
  select { font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #thread { flex: 1; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .empty { color: var(--muted); text-align: center; margin: 32px 0; }
  .turn-user { align-self: flex-start; max-width: 85%; background: var(--mine); border-radius: 14px;
               padding: 8px 14px; white-space: pre-line; }
  .msg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
         white-space: pre-line; }
  .msg.pending { color: var(--muted); }
  .typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
                 background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
  .status { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .answer { margin: 0; }
  .answer-list { margin: 6px 0 0; padding-inline-start: 22px; }
  .answer-list li { margin: 3px 0; }
  .answer-section { font-size: 17px; margin: 14px 0 4px; color: var(--accent); }
  .follow-up { display: block; margin-top: 12px; font: inherit; font-size: 15px; text-align: start; cursor: pointer;
               background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 6px 14px; }
  .cite { font-size: 12px; vertical-align: super; line-height: 0; margin-inline-start: 2px; }
  .cite a { text-decoration: none; }
  .sources-title { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  .card .num { color: var(--accent); margin-inline-end: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 10px; }
  .card summary, .views summary { cursor: pointer; font-weight: 600; font-size: 16px; }
  .card[open] summary, .views[open] summary { margin-bottom: 6px; }
  .card .about { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
  .card blockquote { margin: 0; padding-inline-start: 12px; border-inline-start: 3px solid var(--accent); }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .note { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .views { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 10px; }
  .view { margin: 6px 0; }
  .tools { margin-top: 8px; }
  .no-voice { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .link-btn { font: inherit; font-size: 14px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
  form { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--line);
         border-radius: 14px; padding: 12px; }
  textarea { width: 100%; min-height: 56px; resize: vertical; border: 1px solid var(--line);
             border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--bg); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .send { margin-inline-start: auto; font: inherit; font-weight: 600; padding: 8px 22px;
          border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .send:disabled { opacity: .6; cursor: wait; }
  .mic { font: inherit; font-size: 15px; padding: 7px 12px; border-radius: 10px; cursor: pointer;
         border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .mic[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .voice-note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>مُحاور</h1>
    <div>
      <label for="lang" data-t="lang">اللغة</label>
      <select id="lang"><option value="ar">العربية</option><option value="en">English</option></select>
    </div>
  </header>
  <p class="tag" data-t="tagline">يساعدك في إجابة أسئلتك عن الإسلام، الفقه والعقيدة من مصادر معتمدة وموثوقة، ويحيلك إلى مختص في حالة طلب فتوى.</p>
  <div class="banner" id="synthetic" hidden></div>

  <section id="thread" aria-live="polite">
    <p class="empty" id="empty" data-t="empty">اكتب سؤالك أو تحدّث، وسأجيبك من المصادر.</p>
  </section>

  <form id="ask">
    <textarea id="q" maxlength="500" required aria-label="سؤالك" placeholder="اكتب سؤالك هنا…"></textarea>
    <div class="row">
      <label for="style" data-t="style">أسلوب الشرح</label>
      <select id="style">
        <option value="kids" data-t="kids">للصغار</option>
        <option value="youth" data-t="youth" selected>لليافعين</option>
        <option value="extended" data-t="extended">موسّع</option>
        <option value="newcomer" data-t="newcomer">جديد على الإسلام</option>
      </select>
      <button type="button" class="mic" id="mic" aria-pressed="false" hidden>🎤 تحدّث</button>
      <button type="submit" class="send" id="send" data-t="send">اسأل</button>
    </div>
    <div class="voice-note" id="voiceNote" hidden data-t="voiceNote"></div>
  </form>

  <footer data-t="disclaimer">مُحاور أداة تعريفية مسندة إلى مصادر معتمدة، وليس مصدرًا للفتوى الشخصية.</footer>
</main>
<script>
const UI = {
  ar: { lang: "اللغة", tagline: "يساعدك في إجابة أسئلتك عن الإسلام، الفقه والعقيدة من مصادر معتمدة وموثوقة، ويحيلك إلى مختص في حالة طلب فتوى.",
        qlabel: "سؤالك", placeholder: "اكتب سؤالك هنا…", empty: "اكتب سؤالك أو تحدّث، وسأجيبك من المصادر.",
        style: "أسلوب الشرح", kids: "للصغار", youth: "لليافعين", extended: "موسّع", newcomer: "جديد على الإسلام", send: "اسأل",
        mic: "🎤 تحدّث", micStop: "⏹ إيقاف", voiceNote: "عند استعمال الميكروفون قد يرسل متصفحك صوتك إلى خدمة خارجية لتحويله إلى نص.",
        listen: "🔊 استمع", stop: "⏹ إيقاف", pending: "يكتب…",
        noVoice: "لا يوجد صوت عربي في هذا المتصفح. جرّب متصفح Edge، أو أضف اللغة العربية من إعدادات الكلام في جهازك.",
        views: "أقوال المذاهب",
        disclaimer: "مُحاور أداة تعريفية مسندة إلى مصادر معتمدة، وليس مصدرًا للفتوى الشخصية.",
        synthetic: "تنبيه: النسخة الحالية تعمل على بيانات تجريبية مصطنعة لاختبار البرنامج، وليست نصوصًا دينية.",
        topics: "موضوعات الآية بحسب المصدر", location: "الموضع", grade: "حكم المحدث", hadith: "حديث", sources: "المصادر", source: "المصدر", verify: "تحقق في الدرر السنية", open: "فتح المصدر", error: "تعذّر الاتصال. حاول مرة أخرى.",
        status: { answered: "إجابة من المصادر", abstained: "امتناع", referred: "إحالة إلى مختص", declined: "خارج النطاق", invalid: "", chat: "", unavailable: "" } },
  en: { lang: "Language", tagline: "Helps you answer your questions about Islam, fiqh and creed from approved, trusted sources, and refers you to a specialist when you ask for a fatwa.",
        qlabel: "Your question", placeholder: "Type your question here…", empty: "Type or speak your question, and I will answer from the sources.",
        style: "Explanation style", kids: "For children", youth: "For teens", extended: "Detailed", newcomer: "New to Islam", send: "Ask",
        mic: "🎤 Speak", micStop: "⏹ Stop", voiceNote: "When you use the microphone, your browser may send your voice to an outside service to turn it into text.",
        listen: "🔊 Listen", stop: "⏹ Stop", pending: "Typing…",
        noVoice: "This browser has no English voice. Try Edge, or add a voice in your device's speech settings.",
        views: "The schools' views",
        disclaimer: "Muhawir is an introductory tool grounded in approved sources. It is not a source of personal fatwas.",
        synthetic: "Notice: this version runs on synthetic test data, not religious texts.",
        topics: "Topics listed by the source", location: "Location", grade: "Grading", hadith: "Hadith", sources: "Sources", source: "Source", verify: "Check on dorar.net", open: "Open source", error: "Could not connect. Please try again.",
        status: { answered: "Answer from the sources", abstained: "Abstained", referred: "Referred to a specialist", declined: "Out of scope", invalid: "", chat: "", unavailable: "" } }
};
const $ = (id) => document.getElementById(id);
let lang = "ar";
const chatTurns = [];  // this conversation only: kept in this page, never stored on the server
const MAX_HISTORY = 6;
let recognizer = null, recognizing = false;
let spokenTurn = false;  // the current question was dictated: submit it when speech ends and read the reply aloud

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function applyLang() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t[n.dataset.t]; });
  $("q").placeholder = t.placeholder;
  $("q").setAttribute("aria-label", t.qlabel);
  $("mic").textContent = recognizing ? t.micStop : t.mic;
  $("synthetic").textContent = t.synthetic;
}

// Muhawir's own words only: quoted ayahs, tafsir and hadith are never read by a computer voice.
function spokenText(res) {
  const parts = [];
  if (res.message) parts.push(res.message);
  let heading = "";
  for (const c of res.claims || []) {
    if (c.text.startsWith("«")) continue;
    if (c.section && c.section !== heading) { heading = c.section; parts.push(heading + "."); }
    parts.push((c.label ? c.label + ": " : "") + c.text);
  }
  if (res.follow_up) parts.push(res.follow_up);
  for (const v of res.views || []) parts.push(`${v.school}: ${v.text}`);
  return parts.join("\n");
}

// Browsers load their voices late (Chrome on first use), so wait for them briefly.
function voicesReady() {
  const now = speechSynthesis.getVoices();
  if (now.length) return Promise.resolve(now);
  return new Promise((resolve) => {
    const done = () => resolve(speechSynthesis.getVoices());
    speechSynthesis.addEventListener("voiceschanged", done, { once: true });
    setTimeout(done, 1500);
  });
}

function pickVoice(voices, speakLang) {
  const tag = speakLang === "ar" ? "ar-sa" : "en-us";
  const ofLang = voices.filter((v) => v.lang.toLowerCase().replace("_", "-").startsWith(speakLang));
  return ofLang.find((v) => v.lang.toLowerCase().replace("_", "-") === tag) || ofLang[0] || null;
}

// Short pieces, one after another: Chrome stops long utterances after about 15 seconds.
function pieces(text) {
  return text.split(/(?<=[.!?؟。\n])\s*/).map((x) => x.trim()).filter(Boolean);
}

function listenButton(res) {
  const text = spokenText(res);
  if (!("speechSynthesis" in window) || !text) return null;
  const speakLang = /[\u0600-\u06FF]/.test(text) ? "ar" : "en";  // the reply's own language, e.g. English on request
  const box = el("div", "tools");
  const btn = el("button", "link-btn", UI[speakLang].listen);
  btn.type = "button";
  const reset = () => { delete btn.dataset.playing; btn.textContent = UI[speakLang].listen; };
  box.play = async () => {
    speechSynthesis.cancel();
    const voice = pickVoice(await voicesReady(), speakLang);
    if (!voice) {  // no voice for this language: say so instead of staying silent
      if (!box.querySelector(".no-voice")) box.append(el("div", "no-voice", UI[speakLang].noVoice));
      return;
    }
    btn.dataset.playing = "1"; btn.textContent = UI[speakLang].stop;
    const parts = pieces(text);
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = voice.lang;
      try { u.voice = voice; } catch { /* the language tag alone still picks it */ }
      if (i === parts.length - 1) u.onend = reset;
      u.onerror = reset;
      speechSynthesis.speak(u);
    });
  };
  btn.addEventListener("click", () => {
    if (btn.dataset.playing) { speechSynthesis.cancel(); reset(); return; }
    box.play();
  });
  box.append(btn);
  return box;
}

function renderAnswer(res, style) {
  const open = style === "extended";
  const t = UI[lang];
  $("synthetic").hidden = !res.synthetic;
  const msg = el("div", "msg");
  if (res.message) { const m = el("div", "", res.message); m.dir = "auto"; msg.append(m); }
  // Sources are numbered; each sentence of the answer carries the numbers of the sources it rests on.
  const number = new Map((res.sources || []).map((s, i) => [s.passage_id, i + 1]));
  const cardFor = new Map();
  const quoted = new Set((res.sources || []).map((s) => `«${s.quote}»`));
  // A claim that only repeats a passage word for word is already shown in its source card.
  const shown = new Set();  // passages whose text is itself the answer stay open
  const cite = (c) => {  // the numbers of the sources a sentence rests on, each opening its card
    const sup = el("span", "cite");
    for (const id of new Set(c.passage_ids)) {
      const n = number.get(id);
      if (!n) continue;
      const a = el("a", "", `[${n}]`);
      a.href = "#"; a.title = t.source;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const card = cardFor.get(id);
        if (card) { card.open = true; card.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
      });
      sup.append(a);
    }
    return sup;
  };
  const sentences = (res.claims || []).filter((c) => {
    if (!quoted.has(c.text)) return true;
    c.passage_ids.forEach((id) => shown.add(id));
    return false;
  });
  // one sentence: an optional bold label («المقدار:»), the text, then its source numbers
  const fill = (node, c) => {
    if (c.label) node.append(el("strong", "", c.label + ": "));
    node.append(c.text);
    const sup = cite(c);
    if (sup.childNodes.length) node.append(sup);
  };
  const paragraph = () => { const p = el("p", "answer"); p.dir = "auto"; return p; };
  const list = () => { const u = el("ul", "answer-list"); u.dir = "auto"; return u; };
  const sectioned = sentences.some((c) => c.section);
  if (sectioned) {
    // a short definition, then each part under its own heading, as a list
    let block = null, current = null, outro = null;
    const intro = paragraph();
    for (const c of sentences) {
      if (!c.section) {  // before the first heading: the definition; after the parts: a closing line
        const p = block ? (outro || (outro = paragraph())) : intro;
        if (p.childNodes.length) p.append(" ");
        fill(p, c);
        continue;
      }
      if (c.section !== current) {
        if (intro.childNodes.length && !intro.parentNode) msg.append(intro);
        current = c.section;
        const h = el("h4", "answer-section", current); h.dir = "auto";
        block = list();
        msg.append(h, block);
      }
      const li = el("li"); fill(li, c); block.append(li);
    }
    if (intro.childNodes.length && !intro.parentNode) msg.prepend(intro);
    if (outro) msg.append(outro);
  } else {
    const answer = paragraph();
    // types, kinds, conditions or steps: a short lead sentence, then one item per line
    const items = res.as_list && sentences.length > 1 ? list() : null;
    // the first sentence leads the list only when it introduces it (ends with a colon)
    const lead = items && /[:：]\s*$/.test(sentences[0].text);
    sentences.forEach((c, i) => {
      if (items && (i > 0 || !lead)) { const li = el("li"); fill(li, c); items.append(li); return; }
      if (answer.childNodes.length) answer.append(" ");
      fill(answer, c);
    });
    if (answer.childNodes.length) msg.append(answer);
    if (items) msg.append(items);
  }
  if (res.note) msg.append(el("p", "note", res.note));
  if ((res.views || []).length) {
    // the schools' views are the heart of a disputed question: a heading inside the answer, each school in
    // bold, in the usual order (Hanafi, Maliki, Shafi'i, Hanbali, then others), with its source numbers
    const ORDER = [/حنيف|حنف|احناف|أحناف/, /مالك/, /شافع/, /أحمد|احمد|حنبل/];
    const rank = (name) => { const i = ORDER.findIndex((re) => re.test(name)); return i < 0 ? ORDER.length : i; };
    const views = [...res.views].sort((a, b) => rank(a.school) - rank(b.school));
    const h = el("h4", "answer-section", t.views); h.dir = "auto";
    const ul = el("ul", "answer-list school-views"); ul.dir = "auto";
    for (const v of views) {
      const li = el("li");
      li.append(el("strong", "", v.school + ": "), document.createTextNode(v.text));
      const sup = cite(v);
      if (sup.childNodes.length) li.append(sup);
      ul.append(li);
    }
    // placed right after the opening sentence(s) of the answer, before the other parts
    const firstHeading = msg.querySelector(".answer-section");
    if (firstHeading) { msg.insertBefore(h, firstHeading); msg.insertBefore(ul, firstHeading); }
    else msg.append(h, ul);
  }
  if ((res.sources || []).length) msg.append(el("div", "sources-title", t.sources));
  for (const s of res.sources || []) {
    const card = el("details", "card");
    card.open = open || shown.has(s.passage_id);
    cardFor.set(s.passage_id, card);
    // a hadith shows its grading in the folded line, so it is never seen without it
    const summary = el("summary");
    const label = s.kind !== "hadith" ? `${s.source_name} · ${s.location}`
      : s.grade ? `${t.hadith} (${t.grade}: ${s.grade}) · ${s.source_name}`
      : s.location;  // e.g. «صحيح البخاري، رقم 1»
    summary.append(el("span", "num", `[${number.get(s.passage_id)}]`), label);
    card.append(summary);
    card.append(el("div", "about", s.source_about));
    card.append(el("blockquote", "", s.quote));
    if (s.topics) card.append(el("div", "meta", `${t.topics}: ${s.topics}`));
    const meta = el("div", "meta", `${t.location}: ${s.location}` + (s.grade ? ` · ${t.grade}: ${s.grade}` : ""));
    if (s.source_url) {
      const a = el("a", "", t.open);
      a.href = s.source_url; a.target = "_blank"; a.rel = "noopener";
      meta.append(" · ", a);
    }
    if (s.kind === "hadith") {  // check this hadith on dorar.net, as dorar's own search box for site owners does
      const a = el("a", "", t.verify);
      a.href = "https://dorar.net/hadith/search?q=" + encodeURIComponent(searchPhrase(s.quote));
      a.target = "_blank"; a.rel = "noopener";
      meta.append(" · ", a);
    }
    card.append(meta);
    msg.append(card);
  }
  if (res.follow_up) {  // Muhawir's suggestion to continue the dialogue: a tap asks it
    const next = el("button", "follow-up", res.follow_up);
    next.type = "button"; next.dir = "auto";
    next.addEventListener("click", () => { $("q").value = res.follow_up; $("ask").requestSubmit(); });
    msg.append(next);
  }
  const listen = listenButton(res);
  if (listen) { msg.append(listen); msg.listen = listen; }
  return msg;
}

// A short distinctive phrase of a hadith for dorar's search: the Prophet's words when quoted, else the last words.
function searchPhrase(text) {
  const plain = text.replace(/[\u064B-\u0652\u0670\u0640]/g, "");
  const quoted = plain.match(/"([^"]{15,})"/) || plain.match(/«([^»]{15,})»/);
  const words = (quoted ? quoted[1] : plain).replace(/[^\p{L}\s]/gu, " ").split(/\s+/).filter(Boolean);
  return (quoted ? words.slice(0, 7) : words.slice(-7)).join(" ");
}

function remember(role, text) {
  if (!text) return;
  chatTurns.push({ role, text: text.slice(0, 600) });
  while (chatTurns.length > MAX_HISTORY) chatTurns.shift();
}

function scrollDown() { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }

$("lang").addEventListener("change", (e) => { lang = e.target.value; applyLang(); });

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question || $("send").disabled) return;  // one question at a time: Enter must not send a second
  const askedBySpeech = spokenTurn;
  spokenTurn = false;
  stopListening();
  const style = $("style").value;
  const send = $("send");
  send.disabled = true;
  $("empty")?.remove();
  $("thread").append(el("div", "turn-user", question));
  const pending = el("div", "msg pending typing");  // a typing indicator, no words
  pending.setAttribute("role", "status"); pending.setAttribute("aria-label", UI[lang].pending);
  for (let i = 0; i < 3; i++) pending.append(el("span"));
  $("thread").append(pending);
  $("q").value = "";
  scrollDown();
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, style, lang, history: chatTurns }) });
    if (!r.ok) throw new Error(r.status);
    const res = await r.json();
    const msg = renderAnswer(res, style);
    pending.replaceWith(msg);
    if (askedBySpeech && msg.listen) msg.listen.play();  // spoken question: spoken reply
    // answers and Muhawir's offers (e.g. "shall I explain it more simply?") are remembered, so a follow-up
    // or a "yes" is understood; refusals, errors and "not found" are not answers to explain again
    if (!["invalid", "declined", "abstained", "unavailable"].includes(res.status)) {
      remember("user", res.understood || question);
      remember("assistant", [res.message, ...(res.claims || []).map((c) => c.text)].filter(Boolean).join(" "));
    }
  } catch {
    pending.replaceWith(el("div", "msg", UI[lang].error));
  } finally {
    send.disabled = false;
    scrollDown();
    $("q").focus();
  }
});

$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("ask").requestSubmit(); }
});

// Voice input: the browser's own speech recognition (Chrome, Edge, Safari). Hidden where unavailable.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
function stopListening() { if (recognizer && recognizing) recognizer.stop(); }
if (Recognition) {
  $("mic").hidden = false;
  $("voiceNote").hidden = false;
  $("mic").addEventListener("click", () => {
    if (recognizing) { stopListening(); return; }
    recognizer = new Recognition();
    recognizer.lang = lang === "ar" ? "ar-SA" : "en-US";
    recognizer.interimResults = true;
    recognizer.continuous = false;
    window.speechSynthesis?.cancel();  // stop reading the last reply while the user speaks
    const before = $("q").value.trim();
    let heard = false;
    recognizer.onresult = (ev) => {
      const said = Array.from(ev.results).map((r) => r[0].transcript).join(" ");
      $("q").value = (before ? before + " " : "") + said;
      heard = Boolean(said.trim());
    };
    let failed = false;
    recognizer.onerror = () => { failed = true; };
    recognizer.onend = () => {
      recognizing = false;
      $("mic").setAttribute("aria-pressed", "false");
      $("mic").textContent = UI[lang].mic;
      // the user talked: send what was heard and answer by voice, like a conversation
      if (heard && !failed && $("q").value.trim()) { spokenTurn = true; $("ask").requestSubmit(); }
    };
    recognizing = true;
    $("mic").setAttribute("aria-pressed", "true");
    $("mic").textContent = UI[lang].micStop;
    recognizer.start();
  });
}

fetch("/api/health").then((r) => r.json()).then((h) => { $("synthetic").hidden = !h.synthetic; }).catch(() => {});
applyLang();
</script>
